[build-system]
requires = ["setuptools>=61"]
[project]
name = "charta"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "watchdog", "openpyxl", "pydantic"]
[project.optional-dependencies]
# Native window (dark title bar, Mica, taskbar icon). Without it `charta open`
# falls back to your browser. Install with: pip install -e ".[native]"
native = ["pywebview>=4.0"]
[project.scripts]
charta = "charta.cli:main"
[tool.setuptools.packages.find]
# Only the `charta` package: a flat layout would otherwise sweep in desktop/,
# samples/, eval/ and tools/ and refuse to build.
include = ["charta*"]
[tool.setuptools.package-data]
charta = ["assets/*", "web/static/*", "web/static/**/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
