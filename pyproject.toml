[build-system]
requires = ["setuptools"]
[project]
name = "charta"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "watchdog", "numpy", "openpyxl", "pydantic"]
[project.optional-dependencies]
# Native window (dark title bar, Mica, taskbar icon). Without it `charta open`
# falls back to your browser. Install with: pip install -e ".[native]"
native = ["pywebview>=4.0"]
[project.scripts]
charta = "charta.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
